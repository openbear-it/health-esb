---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: health-esb
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: ghcr.io/openbear-it/health-esb/dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: health-esb
spec:
  selector:
    app: dashboard
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
