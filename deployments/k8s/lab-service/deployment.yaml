---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-service-config
  namespace: health-esb
data:
  SERVICE_NAME: "lab-service"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-service
  namespace: health-esb
  labels:
    app: lab-service
    app.kubernetes.io/part-of: health-esb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-service
  template:
    metadata:
      labels:
        app: lab-service
    spec:
      containers:
      - name: lab-service
        image: ghcr.io/openbear-it/health-esb/lab-service:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: lab-service-config
        env:
        - name: AMQP_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab-service
  namespace: health-esb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
