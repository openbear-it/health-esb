---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-service-config
  namespace: health-esb
data:
  SERVICE_NAME: "audit-service"
  LOG_LEVEL: "info"
  PORT: "8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: health-esb
  labels:
    app: audit-service
    app.kubernetes.io/part-of: health-esb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: audit-service
        image: ghcr.io/openbear-it/health-esb/audit-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: audit-service-config
        env:
        - name: AMQP_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: health-esb
spec:
  selector:
    app: audit-service
  ports:
  - port: 8081
    targetPort: 8081
