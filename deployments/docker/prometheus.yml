global:
  scrape_interval: 15s

scrape_configs:
- job_name: gateway
  static_configs:
  - targets: [ 'gateway:8080' ]
  metrics_path: /metrics

- job_name: audit-service
  static_configs:
  - targets: [ 'audit-service:8081' ]
  metrics_path: /metrics

- job_name: nats
  static_configs:
  - targets: [ 'nats:8222' ]
  metrics_path: /varz
