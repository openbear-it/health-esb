name: Build & Push Docker Images

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/openbear-it/health-esb

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - service: gateway
          dockerfile: deployments/docker/Dockerfile.gateway
        - service: adt-service
          dockerfile: deployments/docker/Dockerfile.adt-service
        - service: lab-service
          dockerfile: deployments/docker/Dockerfile.lab-service
        - service: fhir-bridge
          dockerfile: deployments/docker/Dockerfile.fhir-bridge
        - service: audit-service
          dockerfile: deployments/docker/Dockerfile.audit-service
        - service: notification-service
          dockerfile: deployments/docker/Dockerfile.notification-service
        - service: simulator
          dockerfile: deployments/docker/Dockerfile.simulator
        - service: dashboard
          dockerfile: deployments/docker/Dockerfile.dashboard

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Required for cross-compilation of linux/arm64 on amd64 runners
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Generates tags:
    #   push to main  → :main  + :sha-<short>
    #   push tag v1.2.3 → :1.2.3 + :1.2 + :latest
    #   pull_request  → :pr-<n>  (not pushed)
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # GitHub Actions cache for fast rebuilds
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}
